<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart AI System</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#eef3f8;
}

/* HEADER */
.header{
background:#1d3557;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:700;
letter-spacing:1px;
}

/* CARD */
.card{
background:white;
margin:20px;
padding:25px;
border-radius:18px;
box-shadow:0 12px 30px rgba(0,0,0,0.08);
}

/* GRID FIX */
.form-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

/* FIELD */
.form-group{
display:flex;
flex-direction:column;
}

label{
font-size:12px;
font-weight:700;
color:#333;
margin-bottom:6px;
}

input, select{
padding:11px;
border-radius:10px;
border:1px solid #dcdcdc;
outline:none;
background:#fafafa;
transition:0.2s;
}

input:focus, select:focus{
border-color:#457b9d;
background:white;
box-shadow:0 0 0 3px rgba(69,123,157,0.15);
}

/* BUTTON */
button{
width:100%;
margin-top:20px;
padding:14px;
border:none;
border-radius:12px;
background:#e63946;
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#c92a3a;
transform:scale(1.01);
}

/* RESULT */
.result-box{
margin:20px;
padding:25px;
background:white;
border-radius:18px;
box-shadow:0 12px 30px rgba(0,0,0,0.08);
text-align:center;
}

.result{
font-size:22px;
font-weight:700;
color:#1d3557;
}

/* BAR */
.bar{
height:24px;
background:#ddd;
border-radius:12px;
overflow:hidden;
margin-top:15px;
}

.bar-fill{
height:100%;
width:0%;
background:#2a9d8f;
color:white;
text-align:center;
line-height:24px;
transition:0.5s;
font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:900px){
.form-grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:600px){
.form-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="header">
🏥 Heart AI System
</div>

<div class="card">
<h3>Patient Information</h3>

<div class="form-grid">

<div class="form-group">
<label>Age</label>
<input id="age" type="number">
</div>

<div class="form-group">
<label>Sex</label>
<select id="sex">
<option value="0">Female</option>
<option value="1">Male</option>
</select>
</div>

<div class="form-group">
<label>Chest Pain</label>
<select id="cp">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>

<div class="form-group">
<label>Blood Pressure</label>
<input id="trestbps" type="number">
</div>

<div class="form-group">
<label>Cholesterol</label>
<input id="chol" type="number">
</div>

<div class="form-group">
<label>FBS</label>
<select id="fbs">
<option value="0">0</option>
<option value="1">1</option>
</select>
</div>

<div class="form-group">
<label>ECG</label>
<select id="restecg">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

<div class="form-group">
<label>Max Heart Rate</label>
<input id="thalach" type="number">
</div>

<div class="form-group">
<label>Exercise Angina</label>
<select id="exang">
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div class="form-group">
<label>Oldpeak</label>
<input id="oldpeak" type="number" step="0.1">
</div>

<div class="form-group">
<label>Slope</label>
<select id="slope">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

<div class="form-group">
<label>CA</label>
<select id="ca">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
</select>
</div>

<div class="form-group">
<label>Thal</label>
<select id="thal">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>

</div>

<button onclick="predict()">Analyze Patient</button>
</div>

<div class="result-box">
<div id="result" class="result">Waiting for analysis...</div>

<div class="bar">
<div id="bar" class="bar-fill">0%</div>
</div>
</div>

<script>
async function predict(){

const data = {
age:+age.value,
sex:+sex.value,
cp:+cp.value,
trestbps:+trestbps.value,
chol:+chol.value,
fbs:+fbs.value,
restecg:+restecg.value,
thalach:+thalach.value,
exang:+exang.value,
oldpeak:+oldpeak.value,
slope:+slope.value,
ca:+ca.value,
thal:+thal.value
};

const res = await fetch("http://127.0.0.1:8000/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const r = await res.json();

let risk = Math.round(r.probability * 100);

document.getElementById("result").innerHTML =
r.result + " (" + risk + "% risk)";

let bar = document.getElementById("bar");
bar.style.width = risk + "%";
bar.innerHTML = risk + "%";

bar.style.background =
risk > 70 ? "#e63946" :
risk > 40 ? "#f4a261" : "#2a9d8f";
}
</script>

</body>
</html>
